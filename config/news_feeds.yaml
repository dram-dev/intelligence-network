    topic_hint: water
    limit: 6
  - name: Prairie Rivers Network
    url: "https://prairierivers.org/feed/"
    topic_hint: water
    limit: 5
  - name: Alliance for the Great Lakes
    url: "https://greatlakes.org/feed/"
    topic_hint: water
    limit: 5
  - name: Great Lakes Now          # stand-in while greatlakes.org returns 403 to scripted fetches
    url: "https://www.greatlakesnow.org/feed/"
    topic_hint: water
    limit: 5
  - name: The Waterways Journal
