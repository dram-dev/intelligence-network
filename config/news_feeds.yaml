# Reading-list feeds for the daily digest (the "classic curated" half).
#
# Each entry: url, name, optional topic_hint, limit, include, exclude.
#   include / exclude — regexes matched against title + body by
#   `intelnet.ingest.news.apply_filters`. Use `include` for a feed that is
#   authoritative on a narrow slice of what it publishes (a state newsroom that
#   mostly announces fairs), `exclude` for boilerplate (an alert feed that always
#   carries a "currently no alerts" placeholder).
#
# Illinois-scoped on purpose — the network's ground. Feeds were checked live on
# 2026-09-15; the NWS office pages (`weather.gov/rss_page.php`) were dropped
# because they carry no items, replaced by the `nws_statements` ingestor
# (damage surveys and storm totals from LOT, ILX, DVN, LSX and PAH).

# Illinois EPA's air-quality feeds always publish an item, alert or not.
_action_day: &action_day
  topic_hint: air
  limit: 2
  exclude: "currently no .{0,40}alerts"   # wording varies by area: "no Air Pollution Action Day alerts", "no alerts"

feeds:
  # ── weather ──
  - name: Google News · Illinois severe weather
    url: "https://news.google.com/rss/search?q=Illinois+(tornado+OR+%22severe+weather%22+OR+%22flash+flood%22+OR+hail+OR+%22damaging+winds%22+OR+derecho)+when:2d&hl=en-US&gl=US&ceid=US:en"
    topic_hint: weather
    limit: 20
  - name: Google News · Chicago weather
    url: "https://news.google.com/rss/search?q=Chicago+weather+(storm+OR+flooding+OR+snow+OR+heat+OR+%22lake+effect%22)+when:2d&hl=en-US&gl=US&ceid=US:en"
    topic_hint: weather
    limit: 12
  - name: Google News · Illinois winter + flooding
    url: "https://news.google.com/rss/search?q=Illinois+(%22winter+storm%22+OR+blizzard+OR+%22ice+storm%22+OR+%22river+flooding%22+OR+%22flood+warning%22)+when:2d&hl=en-US&gl=US&ceid=US:en"
    topic_hint: weather
    limit: 12
  - name: Illinois State Climatologist
    url: "https://stateclimatologist.web.illinois.edu/feed/"
    topic_hint: weather
    limit: 5
  - name: Illinois Emergency Management Agency
    url: "https://webservices.illinois.gov/iisnewsrss/getfeed.aspx?AgencyID=28"
    topic_hint: weather
    limit: 6
  - name: WGN-TV Weather Blog
    url: "https://wgntv.com/weather/weather-blog/feed/"
    topic_hint: weather
    limit: 6
  - name: Chicago Sun-Times · weather
    url: "https://chicago.suntimes.com/rss/weather/index.xml"
    topic_hint: weather
    limit: 8
  - name: WBEZ · environment
    url: "https://www.wbez.org/rss/environment/index.xml"
    topic_hint: weather
    limit: 8
  - name: OurQuadCities · weather        # northwest Illinois / Quad Cities
    url: "https://www.ourquadcities.com/weather/feed/"
    topic_hint: weather
    limit: 5

  # ── water ──
  - name: Google News · Illinois rivers + water quality
    url: "https://news.google.com/rss/search?q=Illinois+(%22river+levels%22+OR+%22water+quality%22+OR+nitrate+OR+%22fish+kill%22+OR+%22algae+bloom%22+OR+%22Illinois+River%22+OR+%22Mississippi+River%22+flood)+when:3d&hl=en-US&gl=US&ceid=US:en"
    topic_hint: water
    limit: 12
  - name: Illinois EPA
    url: "https://webservices.illinois.gov/iisnewsrss/getfeed.aspx?AgencyID=31"
    topic_hint: water
    limit: 8
  - name: MWRD Greater Chicago          # no native feed — its own site, via Google News
