# Topic pack: nature — the calendar the land keeps.
#
# Phenology is the oldest citizen science there is: first frost, leaf-out, peak
# colour, the morel flush, the night the geese move. None of it needs
# equipment, all of it varies by a week or two across Illinois, and the
# national networks (USA-NPN, BirdCast, Journey North) exist because nobody can
# observe it from a satellite.

topic: nature
label: Seasons & nature
description: First frost and leaf-out, fall colour, morels, monarchs, migration and wildlife health.

categories:
  events:  Network-detected seasonal events near you — first frost, peak colour, a migration wave
  reports: Every accepted seasonal report near you (raw)
  digest:  The daily digest (Google Doc link) when it is published

metrics:
  fall_color_pct:
    label: Fall colour
    unit: "%"
    aliases: [fall color, fall colour, leaf color, leaf colour, colour change, color change]
    units: {"%": 1, pct: 1, percent: 1}
    words:
      just starting: 10
      patchy: 30
      half turned: 50
      near peak: 80
      at peak: 95
    range: [0, 100]
    tolerance: {abs: 20}
    radius_km: 50
    window_min: 10080
    event: [[80, 0.4]]

  monarch_count:
    label: Monarchs counted
    unit: count
    aliases: [monarchs counted, monarch count, monarchs]
    units: {count: 1}
    range: [0, 10000]
    tolerance: {rel: 0.6, abs: 3}
    radius_km: 40
    window_min: 1440
    event: [[25, 0.4], [100, 0.7]]

