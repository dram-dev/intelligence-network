# Topic pack: agriculture — the crop in the field, as growers talk about it.
#
# Corn and soybeans dominate Illinois; growth stages follow the Iowa State
# scale (V/R for corn, V/R for soy), condition follows the NASS five-step
# scale, drought follows the U.S. Drought Monitor's D0–D4.

topic: agriculture
label: Agriculture
description: Crop stage and condition, planting and harvest progress, pests, disease, damage and drought.

categories:
  events:  Network-detected agricultural events near you — drought stress, crop damage, pest or disease outbreaks
  reports: Every accepted field report near you (raw)
  digest:  The daily digest (Google Doc link) when it is published

metrics:
