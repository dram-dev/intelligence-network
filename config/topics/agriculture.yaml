    label: Corn growth stage
    unit: stage
    aliases: [corn stage, corn at, corn is at, corn]
    units: {stage: 1}
    words:
      planted: 0
      emerged: 1
      ve: 1
      v2: 2
      v3: 3
      v4: 4
      v5: 5
      v6: 6
      v7: 7
      v8: 8
      v9: 9
      v10: 10
      v11: 11
      v12: 12
      v13: 13
      v14: 14
      vt: 15
      tasseling: 15
      tassel: 15
      r1: 16
      silking: 16
      silk: 16
      r2: 17
      blister: 17
      r3: 18
      milk: 18
      r4: 19
      dough: 19
      r5: 20
      dent: 20
      r6: 21
      black layer: 21
      mature: 21
      harvested: 25
    range: [0, 25]
    tolerance: {abs: 2}
