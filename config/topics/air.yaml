# Topic pack: air — particulates, ozone, smoke and odor.
#
# Low-cost PM2.5 monitors are the citizen air network; AQI breakpoints follow
# EPA's 2024 revision (PM2.5 24-h: 9.0 / 35.4 / 55.4 / 125.4 / 225.4 µg/m³).

topic: air
label: Air
cap_category: Health          # CAP 1.2 <category> for the network's published events
description: PM2.5, AQI, ozone, wildfire smoke, odor and open burning.

categories:
  events:  Network-detected air events near you — unhealthy PM2.5 / AQI, ozone, smoke
  reports: Every accepted air reading near you (raw)
  digest:  "The 8:00 morning brief: news tied to the readings behind it, your county, and major readings across every topic"

# The AQI's categories (EPA), by the top of each band. An hourly value is read against the
# daily standards' breakpoints: a guide to how the air is, not the official daily AQI.
aqi_categories: [[50, Good], [100, Moderate], [150, Unhealthy for sensitive groups], [200, Unhealthy],
                 [300, Very unhealthy], [500, Hazardous]]

metrics:
  pm25_ugm3:
    label: PM2.5
    short: PM2.5
    headline: {max: PM2.5}
    unit: "µg/m³"
    aliases: [pm2.5, pm25, "pm 2.5", fine particulates, particulates]
    news_words: [air quality, particulate]
    units: {"ug/m3": 1, "µg/m³": 1, ugm3: 1}
    default_unit: "ug/m3"
    range: [0, 1000]
    tolerance: {rel: 0.35, abs: 5}
    radius_km: 15
    window_min: 120
    event: [[35.5, 0.4], [55.5, 0.7], [125.5, 1.0]]
    aqi: [[0, 9.0, 0, 50], [9.1, 35.4, 51, 100], [35.5, 55.4, 101, 150], [55.5, 125.4, 151, 200],
          [125.5, 225.4, 201, 300], [225.5, 325.4, 301, 500]]
    headline_min: 35.5          # the state's highest only once it's unhealthy for sensitive groups

  aqi:
    label: Air Quality Index
    headline: {max: AQI}
    unit: AQI
    aliases: [aqi, air quality index, air quality]
    news_words: [air quality]
    units: {aqi: 1}
    range: [0, 500]
    tolerance: {abs: 25}
    radius_km: 20
    window_min: 120
    event: [[101, 0.4], [151, 0.7], [201, 1.0]]

  ozone_ppb:
    label: Ozone
    headline: {max: Ozone}
    unit: ppb
    aliases: [ozone, o3]
    news_words: [ozone, smog]
    units: {ppb: 1, ppm: 1000}
    default_unit: ppb
    range: [0, 400]
    tolerance: {abs: 12}
    radius_km: 25
    window_min: 120
    event: [[71, 0.5], [86, 0.8]]
    aqi: [[0, 54, 0, 50], [55, 70, 51, 100], [71, 85, 101, 150], [86, 105, 151, 200], [106, 200, 201, 300]]
    headline_min: 71

  # ── flags ──
  smoke:
    label: Smoke
    kind: flag
    aliases: [smoke, wildfire smoke, smoky, smoky haze, haze, hazy sky]
    news_words: [smoke, smoky, wildfire smoke]
    radius_km: 30
    window_min: 360
    event: [[1, 0.4]]

  odor:
    label: Odor
    kind: flag
    aliases: [odor, odour, chemical smell, ammonia smell, manure smell, gas smell, strong smell]
    radius_km: 10
    window_min: 240

  open_burning:
    label: Open burning
    kind: flag
    aliases: [open burning, field burn, field burning, burning brush, burn pile]
    radius_km: 15
    window_min: 240

# AirNow (feeds/airnow.py): the EPA's hourly monitor values, by the hourly file's parameter name.
airnow_parameters:
  PM2.5: {metric: pm25_ugm3, unit: "ug/m3"}
  OZONE: {metric: ozone_ppb, unit: ppb}

alert_support:
  smoke:      [air_quality_alert, dense_smoke_advisory]
  pm25_ugm3:  [air_quality_alert]
  aqi:        [air_quality_alert]
  ozone_ppb:  [air_quality_alert, ozone_action_day]
