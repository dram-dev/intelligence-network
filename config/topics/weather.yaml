# Topic pack: weather — the first topic on the network.
#
# A topic pack IS the common data language for one subject: the metrics a
# sensor can report, the aliases and units people actually type, the sanity
# ranges, how nearby reports are judged to agree, when a reading becomes an
# event, and which subscription categories the topic exposes. Drop another
# file in this directory (air quality, river gauges, road conditions, …) and
# the parser, corroboration engine, subscriptions and digest pick it up
# unchanged — nothing here is weather-specific in code.
#
# Field reference (metric):
#   label            display name
#   unit             canonical unit every value is stored in
#   kind             numeric (default) | flag (0/1 presence report)
#   aliases          words the parser accepts for this metric
#   units            {typed unit: factor} or {typed unit: {expr: ...}} to canonical
#   words            named sizes/levels → canonical value (hail: "quarter" → 25 mm)
#   range            [min, max] sanity bounds; outside → rejected
#   tolerance        how far two nearby readings may differ and still agree
#                    (abs: absolute in canonical units; rel: fraction of the max)
#   radius_km        two readings within this distance are "nearby"
#   window_min       …and within this many minutes of each other
#   event            [[threshold, severity 0–1], …] — crossing the first row
#                    opens/attaches an event; severity feeds the event score
#   default_unit     unit assumed when a bare number is typed (US contributors
#                    type inches / mph / °F, so those are the defaults)
#   display_unit     {unit, expr} for the human-facing echo (in, mph, °F);
#                    `decimals: 2` fixes the places, `fractions: true` shows
#                    miles the way a METAR does (1/16, 1 1/2)
#   accumulates      true for amounts that build over time (rain, snow): readings
#                    are compared only with readings over the same period, so an
#                    hourly station amount never judges a person's storm total

topic: weather
label: Weather
cap_category: Met          # CAP 1.2 <category> for the network's published events
description: Ground-truth weather observations and official hazard products.

categories:
  warnings: NWS warnings (Severe/Extreme alerts) for your area — tornado, severe thunderstorm, flash flood…
  alerts:   Every NWS alert for your area (watches, advisories, statements)
  events:   Network-detected events — corroborated readings that crossed a threshold near you
  reports:  Every accepted contribution near you (raw, unfiltered)
  digest:   "The 8:00 morning brief: news tied to the readings behind it, your county, and major readings across every topic"

# NWS alert severity → subscription categories that receive it.
alert_routing:
  Extreme:  [warnings, alerts]
  Severe:   [warnings, alerts]
  Moderate: [alerts]
  Minor:    [alerts]
  Unknown:  [alerts]

metrics:
  temp_c:
    label: Temperature
    headline: {max: High, min: Low}
    unit: degC
    aliases: [temp, temperature, t, air temp]
    news_words: [heat, hot, cold, freeze, frost, temperatures]
    units: {c: 1, "°c": 1, degc: 1, f: {expr: "(x - 32) * 5 / 9"}, "°f": {expr: "(x - 32) * 5 / 9"}, degf: {expr: "(x - 32) * 5 / 9"}, degrees: {expr: "(x - 32) * 5 / 9"}, deg: {expr: "(x - 32) * 5 / 9"}}
    default_unit: f
    range: [-45, 55]
    tolerance: {abs: 3.0}
    radius_km: 20
    window_min: 60
    display_unit: {unit: "°F", expr: "x * 9 / 5 + 32"}
    event: [[40, 0.5], [43, 0.8]]

  dewpoint_c:
    label: Dew point
    short: Dew point
    unit: degC
    aliases: [dewpoint, dew point, dp, dew]
    units: {c: 1, "°c": 1, f: {expr: "(x - 32) * 5 / 9"}, "°f": {expr: "(x - 32) * 5 / 9"}, degrees: {expr: "(x - 32) * 5 / 9"}, deg: {expr: "(x - 32) * 5 / 9"}}
    default_unit: f
    range: [-45, 35]
    tolerance: {abs: 3.0}
    radius_km: 20
    window_min: 60
    display_unit: {unit: "°F", expr: "x * 9 / 5 + 32"}

  humidity_pct:
    label: Relative humidity
    unit: pct
    aliases: [humidity, rh, relative humidity]
    units: {"%": 1, pct: 1, percent: 1}
    default_unit: "%"
    range: [0, 100]
    tolerance: {abs: 15}
    radius_km: 20
    window_min: 60

  pressure_hpa:
    label: Pressure
    short: Pressure
    unit: hPa
    aliases: [pressure, baro, barometer, mslp, slp]
    units: {hpa: 1, mb: 1, mbar: 1, inhg: 33.8639, "in": 33.8639, pa: 0.01}
    default_unit: inhg
    range: [900, 1100]
    tolerance: {abs: 4}
    radius_km: 40
    window_min: 60
    display_unit: {unit: inHg, expr: "x / 33.8639", decimals: 2}

  wind_ms:
    label: Sustained wind
    short: Wind
    unit: m/s
    aliases: [wind, wind speed, sustained, sustained wind]
    units: {ms: 1, "m/s": 1, mps: 1, mph: 0.44704, kt: 0.514444, kts: 0.514444, knots: 0.514444, kmh: 0.277778, "km/h": 0.277778}
    default_unit: mph
    range: [0, 90]
    tolerance: {rel: 0.35, abs: 3}
    radius_km: 20
    window_min: 60
    display_unit: {unit: mph, expr: "x / 0.44704"}
    event: [[18, 0.4], [26, 0.7]]

  wind_gust_ms:
    label: Wind gust
    short: Gust
    unit: m/s
    aliases: [gust, gusts, wind gust, wind gusts, gusting, peak gust]
    news_words: [wind, winds, gusts, gusty, damaging]
    units: {ms: 1, "m/s": 1, mps: 1, mph: 0.44704, kt: 0.514444, kts: 0.514444, knots: 0.514444, kmh: 0.277778, "km/h": 0.277778}
    default_unit: mph
    range: [0, 120]
    tolerance: {rel: 0.35, abs: 4}
    radius_km: 25
    window_min: 90
    display_unit: {unit: mph, expr: "x / 0.44704"}
    # 58 mph is the NWS severe-thunderstorm wind criterion; 74 mph hurricane force.
    event: [[26, 0.5], [33, 0.8], [40, 1.0]]

  rain_mm:
    label: Rainfall
    headline: {max: Rain}
    unit: mm
    aliases: [rain, rainfall, precip, precipitation, rain total, storm total]
    news_words: [rain, rainfall, rainy, soaking, downpour, deluge, wet]
    units: {mm: 1, "in": 25.4, inch: 25.4, inches: 25.4, cm: 10}
    default_unit: "in"
    range: [0, 600]
    tolerance: {rel: 0.4, abs: 6}
    radius_km: 15
    window_min: 180
    display_unit: {unit: "in", expr: "x / 25.4", decimals: 2}     # 0.23 in, 1.50 in: as gauges are read
    event: [[25, 0.4], [50, 0.7], [100, 1.0]]
    accumulates: true

  snow_cm:
    label: Snowfall
    headline: {max: Snow}
    unit: cm
    aliases: [snow, snowfall, snow total, snow depth]
    news_words: [snow, snowfall, blizzard]
    units: {cm: 1, "in": 2.54, inch: 2.54, inches: 2.54, mm: 0.1}
    default_unit: "in"
    range: [0, 150]
    tolerance: {rel: 0.4, abs: 3}
    radius_km: 20
    window_min: 360
    display_unit: {unit: "in", expr: "x / 2.54", decimals: 1}
    event: [[15, 0.4], [30, 0.8]]
    accumulates: true

  hail_mm:
    label: Hail size
    headline: {max: Hail}
    unit: mm
    aliases: [hail, hailstones, hail size]
    news_words: [hail, hailstorm]
    units: {mm: 1, "in": 25.4, inch: 25.4, inches: 25.4, cm: 10}
    # NWS hail size chart (diameter, the chart's inches in mm: golf ball 1.75 in). Words beat
    # numbers for most people.
    words:
      pea: 6.35
      marble: 12.7
      mothball: 12.7
      dime: 17.78
      penny: 19.05
      nickel: 22.35
      quarter: 25.4
      half dollar: 31.75
      ping pong: 38.1
      ping-pong: 38.1
      walnut: 38.1
      golf ball: 44.45
      golfball: 44.45
      golf-ball: 44.45
      hen egg: 50.8
      egg: 50.8
      tennis ball: 63.5
      baseball: 69.85
      tea cup: 76.2
      teacup: 76.2
      grapefruit: 101.6
      softball: 114.3
    default_unit: "in"
    range: [0, 200]
    tolerance: {rel: 0.5, abs: 10}
    radius_km: 25
    window_min: 90
    display_unit: {unit: "in", expr: "x / 25.4", decimals: 2}     # 1.75 in, as the NWS writes hail
    # 1 in (quarter) is the NWS severe criterion; thresholds sit a hair under the chart sizes
    # (1.75 × 25.4 is 44.449… in floating point)
    event: [[25, 0.5], [44, 0.8], [69, 1.0]]

  visibility_km:
    label: Visibility
    short: Visibility
    unit: km
    aliases: [visibility, vis, vsby]
    news_words: [fog, foggy, visibility]
    units: {km: 1, mi: 1.609344, mile: 1.609344, miles: 1.609344, m: 0.001}
    default_unit: mi
    range: [0, 100]
    tolerance: {rel: 0.5, abs: 1}
    radius_km: 20
    window_min: 60
    display_unit: {unit: mi, expr: "x / 1.609344", fractions: true}
    # low visibility: fog / blowing snow / dust
    event: [[0.4, 0.4]]
    event_direction: below

  # ── flags: presence reports ("tornado on the ground", "street flooding") ──
  tornado:
    label: Tornado
    kind: flag
    aliases: [tornado, twister, tornado on the ground]
    news_words: [tornado, tornadoes, twister]
    radius_km: 30
    window_min: 90
    event: [[1, 1.0]]

  funnel_cloud:
    label: Funnel cloud
    kind: flag
    aliases: [funnel, funnel cloud, wall cloud, rotation]
    radius_km: 30
    window_min: 90
    event: [[1, 0.5]]

  flooding:
    label: Flooding
    kind: flag
    aliases: [flood, flooding, flash flood, street flooding, water over road, high water]
    news_words: [flood, flooding, flash flood, flooded]
    radius_km: 15
    window_min: 180
    event: [[1, 0.7]]

  wind_damage:
    label: Wind damage
    kind: flag
    aliases: [wind damage, tree down, trees down, power lines down, roof damage, damage]
    news_words: [wind damage, storm damage, damaging winds, trees down]
    radius_km: 20
    window_min: 180
    event: [[1, 0.6]]

  power_outage:
    label: Power outage
    kind: flag
    aliases: [outage, power outage, power out, no power, blackout]
    news_words: [power outage, outages, without power, blackout]
    radius_km: 15
    window_min: 240
    event: [[1, 0.4]]

  lightning:
    label: Lightning
    kind: flag
    aliases: [lightning, thunder]
    news_words: [lightning]
    radius_km: 20
    window_min: 60

  # An absence report: "nothing here" during a storm marks where it didn't reach.
  nothing_here:
    label: All quiet
    kind: flag
    aliases: [nothing here, all quiet, all quiet here, nothing to report]
    scored: false          # kept for the map; never corroborated, trusted or an event
    radius_km: 10
    window_min: 60

# The report keyboard in the chat. A button with `choices` opens a picker; each
# choice is a reading in this data language, recorded where the person is. A
# button with `send` records its reading at once, with an Undo button.
quick_reports:
  - id: rain
    button: "🌧 Rain"
    ask: How much rain so far? Pick the closest total.
    choices:
      - ["0.1 in", "rain 0.1in"]
      - ["¼ in", "rain 0.25in"]
      - ["½ in", "rain 0.5in"]
      - ["1 in", "rain 1in"]
      - ["1½ in", "rain 1.5in"]
      - ["2 in", "rain 2in"]
      - ["3 in or more", "rain 3in"]
      - ["None", "nothing here -- no rain"]
  - id: hail
    button: "🧊 Hail"
    ask: How big? Pick the closest match.
    visual: size                  # the Mini App draws each choice to scale
    example: hail 1.25in          # what "Type it" suggests
    choices:
      - ["Pea ¼″", "hail pea"]
      - ["Penny ¾″", "hail penny"]
      - ["Quarter 1″", "hail quarter"]
      - ["Ping-pong 1½″", "hail ping pong"]
      - ["Golf ball 1¾″", "hail golf ball"]
      - ["Tennis ball 2½″", "hail tennis ball"]
      - ["Baseball 2¾″", "hail baseball"]
      - ["Softball 4½″", "hail softball"]
      - ["None", "nothing here -- no hail"]
  - id: wind
    button: "💨 Wind"
    ask: How strong was the strongest gust, roughly?
    choices:
      - ["30 mph", "gust 30 mph"]
      - ["40 mph", "gust 40 mph"]
      - ["50 mph", "gust 50 mph"]
      - ["60 mph", "gust 60 mph"]
      - ["70 mph", "gust 70 mph"]
      - ["80+ mph", "gust 80 mph"]
      - ["Trees down", "trees down"]
  - id: flooding
    button: "🌊 Flooding"
    send: flooding
  - id: damage
    button: "🌳 Damage"
    send: trees down
  - id: nothing
    button: "✅ Nothing here"
    send: nothing here
  - id: snow                      # asked after winter alerts; not on the keyboard
    keyboard: false
    button: "❄️ Snow"
    ask: How much snow fell? Pick the closest total.
    choices:
      - ["1 in", "snow 1in"]
      - ["2 in", "snow 2in"]
      - ["4 in", "snow 4in"]
      - ["6 in", "snow 6in"]
      - ["8 in", "snow 8in"]
      - ["12 in or more", "snow 12in"]
      - ["None", "nothing here -- no snow"]

# Radar grids that check people's readings where no station is near (grids.py).
# Read at the reading's point once the grid covers its time; radar is rough, so
# the tolerance is wider than a neighbor's, a mild miss only nudges trust, and a
# match counts as half a reference. `reader`: arcgis_image (an ArcGIS ImageServer
# point query; the product is a catalog item name) or mrms_grib2 (an NCEP MRMS
# GRIB2 file; the URL takes {product}). Tolerances and min_signal are canonical (mm).
reference_grids:
  rain_mm:
    label: radar rainfall estimate (MRMS)
    reader: arcgis_image
    url: https://mapservices.weather.noaa.gov/raster/rest/services/obs/mrms_qpe/ImageServer
    windows: {1h: conus_QPE_01H, 3h: conus_QPE_03H, 6h: conus_QPE_06H, 12h: conus_QPE_12H,
              24h: conus_QPE_24H, 48h: conus_QPE_48H, 72h: conus_QPE_72H}
    unit: mm                      # raw pixels are mm (the service's legend says inches)
    default_window: 24h           # a storm total "so far" with no period
    max_age: 6h                   # only the latest grid is served; later rain would pile on
    min_signal: 1
    tolerance: {rel: 0.5, abs: 6}
  hail_mm:
    label: radar hail estimate (MRMS MESH)
    reader: mrms_grib2
    url: https://mrms.ncep.noaa.gov/2D/{product}/MRMS_{product}.latest.grib2.gz
    windows: {30m: MESH_Max_30min, 1h: MESH_Max_60min, 2h: MESH_Max_120min, 4h: MESH_Max_240min,
              6h: MESH_Max_360min, 24h: MESH_Max_1440min}
    unit: mm
    max_age: 24h
    neighborhood_km: 5            # the largest estimate within 5 km: swaths are narrow
    min_signal: 13
    tolerance: {rel: 0.6, abs: 13}

# What to ask the people an alert reached, one tap to answer: the answer is a
# reading at their place (live location, else home), timed to when the storm was
# there. `when: ended` asks once it's over; `when: issued` asks while it's in
# effect, so it is only for slow hazards where looking around is safe. A chat is
# asked at most once per alert and once every few hours; /followups off stops it.
alert_questions:
  - events: [Severe Thunderstorm Warning, Tornado Warning]
    when: ended
    ask: What did the storm bring to your place?
    reports: [hail, wind, rain, damage, nothing]
  - events: [Flash Flood Warning]
    when: ended
    ask: Was there flooding near you?
    reports: [flooding, rain, nothing]
  - events: [Flood Warning, Flood Advisory]
    when: issued
    ask: Is there water where it shouldn't be near you? Only look from somewhere safe.
    reports: [flooding, nothing]
  - events: [Winter Storm Warning, Winter Weather Advisory, Blizzard Warning]
    when: ended
    ask: How much snow did you get?
    reports: [snow, nothing]

# Which active NWS alerts count as official support for a human report of a
# metric (a tornado report under a Tornado Warning is reference-corroborated).
alert_support:
  tornado:       [tornado_warning]
  funnel_cloud:  [tornado_warning, severe_thunderstorm_warning, tornado_watch]
  hail_mm:       [severe_thunderstorm_warning]
  wind_gust_ms:  [severe_thunderstorm_warning, high_wind_warning, wind_advisory]
  wind_damage:   [severe_thunderstorm_warning, high_wind_warning]
  flooding:      [flash_flood_warning, flood_warning, flood_advisory]
  rain_mm:       [flash_flood_warning, flood_warning, flood_advisory, flood_watch]
  snow_cm:       [winter_storm_warning, winter_weather_advisory, blizzard_warning]
  visibility_km: [dense_fog_advisory, blizzard_warning]
  power_outage:  [severe_thunderstorm_warning, high_wind_warning, ice_storm_warning]

# The alert card's picture (cardmap.py). A warning is drawn over one radar's lowest sweep
# at full resolution: NEXRAD Level III N0B (reflectivity, 0.5° × 250 m bins, a sweep every
# few minutes) from Unidata's public archive on AWS, the radar nearest the warning. Colours
# run smoothly between the stops (dBZ → #RRGGBB or #RRGGBBAA); below the first, nothing.
card_radar:
  product: N0B
  sites:                                  # the radars that see Illinois: id → [lat, lon, name]
    ILX: [40.1506, -89.3368, Lincoln]
    LOT: [41.6044, -88.0848, Chicago]
    DVN: [41.6117, -90.5809, Quad Cities]
    LSX: [38.6989, -90.6828, St. Louis]
    PAH: [37.0684, -88.7719, Paducah]
    VWX: [38.2603, -87.7247, Evansville]
    IND: [39.7075, -86.2803, Indianapolis]
    MKX: [42.9678, -88.5506, Milwaukee]
  stale_minutes: 15                       # older than this and the picture says "no radar"
  # Echoes that aren't weather (insects, birds, ground clutter, wind farms) are dropped using
  # the same scan's dual-pol correlation coefficient (N0C): below 0.85 is not rain, snow or
  # hail. A tornado's debris reads low too, so a strong echo (keep_above dBZ) stays when it's
  # within storm_km of a storm; out in clear air it's clutter.
  quality: {product: N0C, below: 0.85, keep_above: 40, storm_km: 3}
  colours:
    - [15, "#3A8F6A00"]
    - [20, "#3F9C7466"]
    - [26, "#46AE6C9C"]
    - [31, "#3A9E52D6"]
    - [35, "#D9D23A"]
    - [40, "#F2A62B"]
    - [45, "#EC6A24"]
    - [50, "#D93131"]
    - [55, "#AD1A48"]
    - [60, "#C23BC2"]
    - [65, "#EBA4FF"]
    - [72, "#FFFFFF"]
  legend: [[20, Light], [48, Heavy], [70, Hail]]

# An alert's colour on the card's picture, by event (else by severity). Bright enough to
# read over the radar on a dark map.
alert_colours:
  Tornado Warning: "#FF3B30"
  Severe Thunderstorm Warning: "#FFB020"
  Flash Flood Warning: "#FF4F8B"
  Flood Warning: "#34D07B"
  Flood Advisory: "#5BC0A0"
  Flood Watch: "#3FB27F"
  Special Weather Statement: "#F5E08A"
  Tornado Watch: "#FF6F6F"
  Severe Thunderstorm Watch: "#E0A93A"
  Winter Storm Warning: "#FF6FD8"
  Blizzard Warning: "#FF6A3D"
  Ice Storm Warning: "#C78BFF"
  Dense Fog Advisory: "#9FB3BF"
  Heat Advisory: "#FF8C4B"
  Excessive Heat Warning: "#FF4B6E"

# NWS alert impact tags: CAP parameters on warnings (maxHailSize "1.75",
# maxWindGust "70 MPH", tornadoDetection "RADAR INDICATED"…). The alert card
# shows them, and when an update raises one, people who already have the card
# are notified again. Numbers rise by value; `levels` rise left to right.
# `show` places a tag on the alert card and in the app: header (beside the event
# name), chip (the impact line, the default) or tag (a plain note). `chip` is the
# short label there; `metric` names the size in words (1.75 in → golf ball).
alert_parameters:
  maxHailSize:              {label: Hail up to, unit: in, chip: Hail, metric: hail_mm}
  maxWindGust:              {label: Wind, unit: mph, chip: Wind}
  tornadoDetection:         {label: Tornado, levels: [POSSIBLE, RADAR INDICATED, OBSERVED], show: tag}
  tornadoDamageThreat:      {label: Tornado damage threat, levels: [CONSIDERABLE, CATASTROPHIC], show: header}
  thunderstormDamageThreat: {label: Damage threat, levels: [CONSIDERABLE, DESTRUCTIVE], show: header}
  flashFloodDetection:      {label: Flash flood, levels: [RADAR INDICATED, OBSERVED], show: tag}
  flashFloodDamageThreat:   {label: Flash flood damage threat, levels: [CONSIDERABLE, CATASTROPHIC], show: header}

# ── Official product mappings ─────────────────────────────────────────────
# IEM Local Storm Report types → metric (+ unit the magnitude is reported in).
lsr_types:
  HAIL:              {metric: hail_mm, unit: "in"}
  TSTM WND GST:      {metric: wind_gust_ms, unit: mph}
  NON-TSTM WND GST:  {metric: wind_gust_ms, unit: mph}
  MARINE TSTM WIND:  {metric: wind_gust_ms, unit: mph}
  TSTM WND DMG:      {metric: wind_damage}
  NON-TSTM WND DMG:  {metric: wind_damage}
  RAIN:              {metric: rain_mm, unit: "in"}
  HEAVY RAIN:        {metric: rain_mm, unit: "in"}
  SNOW:              {metric: snow_cm, unit: "in"}
  HEAVY SNOW:        {metric: snow_cm, unit: "in"}
  FLASH FLOOD:       {metric: flooding}
  FLOOD:             {metric: flooding}
  TORNADO:           {metric: tornado}
  FUNNEL CLOUD:      {metric: funnel_cloud}
  LANDSPOUT:         {metric: funnel_cloud}
  WATERSPOUT:        {metric: funnel_cloud}
  LIGHTNING:         {metric: lightning}
  DENSE FOG:         {metric: visibility_km, unit: mi}

# IEM ASOS "currents" columns → metric (+ the column's unit).
station_fields:
  tmpf:  {metric: temp_c, unit: f}
  dwpf:  {metric: dewpoint_c, unit: f}
  relh:  {metric: humidity_pct, unit: "%"}
  sknt:  {metric: wind_ms, unit: kt}
  gust:  {metric: wind_gust_ms, unit: kt}
  phour: {metric: rain_mm, unit: "in", period: 1h}   # rain in the past hour, not a storm total
  alti:  {metric: pressure_hpa, unit: inhg}
  vsby:  {metric: visibility_km, unit: mi}
