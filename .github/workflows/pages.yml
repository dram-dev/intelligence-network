name: Pages

# Publishes docs/ (the public site + JSON snapshot) to GitHub Pages whenever it
# changes on master. Enable Pages once in Settings → Pages → Source: "GitHub
# Actions". Pages needs a public repo on the free plan.

on:
  push:
    branches: [master]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # deploy-pages looks the artifact up once, with no retry. On 21 Nov 2026 it
      # asked 0.4 s after the upload finished and was told there was none (the
      # artifact list lagged). One more try after a pause covers that.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
