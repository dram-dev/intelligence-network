[project]
name = "intelligence-network"
version = "0.1.0"
description = "A decentralized sensor network + curated digest. Weather first, Illinois first; any topic with a common data language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "feedparser>=6.0",
    "rich>=13.7",
    "click>=8.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "digest-core",
]

[project.scripts]
intelnet = "intelnet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelnet"]

# digest-core is the shared digest framework (DB base schema, ingest registry,
# LLM backends, Telegram transport, the cross-digest run lock). It is canonically
# housed in the sibling pc-insurance-digest repo's packages/ and consumed here as
# an editable path dep, exactly like macro-ai-digest does.
[tool.uv.sources]
digest-core = { path = "../pc-insurance-digest/packages/digest-core", editable = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
